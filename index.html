  <button id="soundToggle" class="sound-toggle muted" aria-label="Toggle Sound" title="Sound">

      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path class="wave wave--1" d="M15.5 8.5a5 5 0 0 1 0 7"></path>
      <path class="wave wave--2" d="M19 5a9 9 0 0 1 0 14"></path>
    </svg>
    <svg class="sound-icon sound-icon--off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="22" y1="9" x2="16" y2="15"></line>
      <line x1="16" y1="9" x2="22" y2="15"></line>
    </svg>
  </button>

          <div class="leaf leaf--0"></div>

        <div class="grow-ans" style="--d:2.2s">
